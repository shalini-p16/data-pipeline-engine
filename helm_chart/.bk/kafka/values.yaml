replicaCount: 1

image:
  repository: confluentinc/cp-.bk
  tag: 7.4.0
  pullPolicy: IfNotPresent

zookeeper:
  image:
    repository: confluentinc/cp-zookeeper
    tag: 7.4.0
    pullPolicy: IfNotPresent
  replicaCount: 1

service:
  type: ClusterIP
  kafkaPort: 9092
  zookeeperPort: 2181

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
