apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    app: {{ .Chart.Name }}
spec:
  type: ClusterIP
  ports:
  {{- range .Values.portForward.ports }}
  - name: {{ .name }}
    port: {{ .targetPort }}
    targetPort: {{ .targetPort }}
  {{- end }}
  selector:
    app: {{ .Chart.Name }}
