replicaCount: 1


image:
  repository: bitnami/kafka
  tag: 3.4.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9092
  name: "my-kafka"

serviceAccount:
  create: true
  name: ""

auth:
  enabled: true
  clientProtocol: sasl_plaintext
  interBrokerProtocol: sasl_plaintext
  jaas:
    clientUsers:
      - admin
    clientPasswords:
      - admin-secret
    interBrokerUser: admin
    interBrokerPassword: admin-secret

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 250m

ingress:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

portForward:
  enabled: true  # Enable or disable port forwarding
  ports:
    - name: kafka
      localPort: 9092
      targetPort: 9092
    - name: zookeeper
      localPort: 2181
      targetPort: 2181
kafka:
  environment:
    ALLOW_PLAINTEXT_LISTENER: "yes"


